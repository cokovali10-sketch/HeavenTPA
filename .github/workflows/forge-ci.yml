# Сгенерировано FORGE (forge ci). Правь смело — это обычный workflow.
name: forge
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: tests
        run: gradle test
