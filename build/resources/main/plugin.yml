name: HeavenTPA
version: 1.0.0
main: com.vitalis.tpa.HeavenTPA
api-version: "1.21"
author: Vitalis
description: "Heaven teleport requests with chat accept/decline buttons. Purpur/Paper 1.21.11."
depend: []
softdepend: [Essentials]
commands:
  tpa:
    description: "Ask to teleport to a player."
    usage: "/tpa <ник>"
  tpahere:
    description: "Ask a player to teleport to you."
    usage: "/tpahere <ник>"
  tpaccept:
    description: "Accept a teleport request."
    usage: "/tpaccept [ник]"
  tpdeny:
    description: "Decline a teleport request."
    usage: "/tpdeny [ник]"
permissions:
  heaventpa.use:
    description: "Send and answer teleport requests."
    default: true
  heaventpa.admin:
    description: "Reload config."
    default: op
